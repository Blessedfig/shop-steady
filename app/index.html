<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">

<meta name="theme-color" content="#1B4332">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Downtown Stube">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<body>
<a class="skip" href="#main">Skip to main content</a>

<div id="gate" class="gate" role="main" hidden>
  <div class="card">
    <div class="row"><span class="mark" aria-hidden="true"></span><span class="eyebrow">Downtown Stube</span></div>
    <h1>Sign in</h1>
    <form id="pwForm" class="grid">
      <label class="f">Email<input id="email" type="email" autocomplete="username" inputmode="email" required placeholder="you@example.com"></label>
      <label class="f">Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <div class="card soft" style="box-shadow:none;gap:.5rem">
      <b>First time here, or forgot your password?</b>
      <span class="small">We'll email you a sign-in code. After you're in, you can choose a password.</span>
      <div class="row"><button class="btn ghost sm" id="sendBtn" type="button">Email me a sign-in code</button></div>
    </div>
    <form id="codeForm" class="grid" hidden>
      <label class="f">Code from the email<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="12" required placeholder="123456"></label>
      <button class="btn" type="submit">Sign in with the code</button>
    </form>
    <p id="gateMsg" class="msg" hidden></p>
    <div class="row"><button class="btn quiet sm" id="demoBtn" type="button">Just looking? Try the demo with sample data</button></div>
    <p class="small muted">You stay signed in on this device until you sign out or go 12 hours without using it.</p>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="in">
      <a class="brand" href="#/home"><span class="mark" aria-hidden="true"></span>Downtown Stube</a>
      <label class="switch">View as<select id="tierSel" aria-label="View the app as"></select></label>
      <label class="switch">Store<select id="siteSel" aria-label="Which store"></select></label>
      <div class="who"><span id="whoEmail"></span><button class="linkbtn" id="pwChange" type="button">Password</button><button class="linkbtn" id="signOut" type="button">Sign out</button></div>
    </div>
  </header>
  <div class="shell">
    <nav class="side" id="nav" aria-label="App sections"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<script src="vendor/supabase-js-2.118.0.js"></script>
<script src="config.js"></script>
<script src="lib/idle.js"></script>
<script src="lib/pw.js"></script>
<script src="data.js"></script>
<script src="shell.js"></script>
<script src="inventory.js"></script>
<script src="setup.js"></script>
<script src="shifts.js"></script>
<script src="voice.js"></script>
<script src="count.js"></script>
<script src="people.js"></script>
<script src="notes.js"></script>
<script src="taxlog.js"></script>
<script src="receive.js"></script>
<script src="till.js"></script>
<script src="inbox.js"></script>
<script src="shopify.js"></script>
<script src="lib/fixrules.js"></script>
<script src="fix.js"></script>
<script src="ask.js"></script>
<script src="hr.js"></script>
<script src="decide.js"></script>
<script src="weekly.js"></script>
<script src="sync.js"></script>
<script src="sw-register.js"></script>
</body>
</html>
